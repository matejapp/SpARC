<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>SpARC app icon</title>
  <!-- Full-bleed square: iOS applies its own corner mask, so no rounding and no transparency. -->
  <defs>
    <radialGradient id="sparc-bg" cx="0.85" cy="0" r="1.3">
      <stop offset="0" stop-color="#FFC9A3"/>
      <stop offset="0.4" stop-color="#FFA177"/>
      <stop offset="0.78" stop-color="#F7894F"/>
      <stop offset="1" stop-color="#E8743D"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sparc-bg)"/>
  <svg x="186" y="186" width="652" height="652" viewBox="0 0 100 100">
    <path d="M50 20A30 30 0 1 1 20 50" fill="none" stroke="#0A0D14" stroke-width="14" stroke-linecap="round"/>
    <circle cx="28.8" cy="28.8" r="7" fill="#0A0D14"/>
  </svg>
</svg>
